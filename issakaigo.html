<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>113.com</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <div class="container header-container">
      <h1 class="logo"><a href="#">113helpper</a></h1>
      <nav class="nav">
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ヒーローセクション -->
  <section class="hero">
    <div class="container hero-content">
      <h2>あなたのビジネスを、次のステージへ。</h2>
      <p>いっさにお任せこっちみんなぶす</p>
      <a href="#contact" class="btn">お問い合わせはこちら</a>
    </div>
  </section>

  <!-- アバウトセクション -->
  <section id="about" class="section">
    <div class="container">
      <h2 class="section-title">About Us</h2>
      <p class="section-desc">いっさで金を稼ぐそういうAIに対抗した存在を作りたい</p>
    </div>
  </section>

  <!-- サービスセクション -->
  <section id="services" class="section bg-light">
    <div class="container">
      <h2 class="section-title">Services</h2>
      <div class="card-grid">
        <div class="card">
          <h3>サービス 01</h3>
          <p>いっさがあなたのご自宅に突撃</p>
        </div>
        <div class="card">
          <h3>サービス 02</h3>
          <p>いっさの恋愛相談所</p>
        </div>
        <div class="card">
          <h3>サービス 03</h3>
          <p>いっさレンタル愚痴をたくさん話せます。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- お問い合わせセクション -->
  <section id="contact" class="section">
    <div class="container">
      <h2 class="section-title">Contact</h2>
      <form class="contact-form">
        <div class="form-group">
          <label for="name">菊地一冴</label>
          <input type="text" id="name" name="name" required placeholder="菊地　ともえ">
        </div>
        <div class="form-group">
          <label for="email">okutikussagg</label>
          <input type="email" id="email" name="email" required placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label for="message">よわめのいっさでした</label>
          <textarea id="message" name="message" rows="5" required placeholder="野郎のことが嫌いです"></textarea>
        </div>
        <button type="submit" class="btn">送信する</button>
      </form>
    </div>
  </section>

  <!-- フッター -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 BrandName. All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
